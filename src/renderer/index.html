<!doctype html>
<!-- Floating shell port: rain-knows/deepseek-harness-orb, MIT, commit
     72f1d738458a223696685a909e806b683eff5885,
     apps/desktop/renderer/floating.html. Pi-only surfaces and CSP are documented
     in doc/frontend-port.md and THIRD_PARTY_NOTICES.md §3.5. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
    <title id="page-title">pi-orb</title>
    <link rel="stylesheet" href="floating.css">
    <link rel="stylesheet" href="orb-surface.css">
  </head>
  <body>
    <section id="panel" hidden>
      <button id="history" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
          <path d="M8 4.5v4l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <div id="permission">
        <button id="permission-button" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="permission-label"></span>
          <svg viewBox="0 0 12 12" aria-hidden="true" focusable="false">
            <path d="M3 4.5 6 8l3-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <ul id="permission-menu" role="listbox" hidden>
          <li><button id="access-read-only" type="button" role="option" data-level="read-only">只读</button></li>
          <li><button id="access-workspace-write" type="button" role="option" data-level="workspace-write">工作区写入</button></li>
          <li><button id="access-full" type="button" role="option" data-level="full-access">完全访问</button></li>
        </ul>
      </div>
      <button id="new-conversation" type="button">+</button>
      <div id="transcript" role="log" aria-live="polite">
        <div id="workspace-gate" class="history-empty" hidden>
          <h1>选择工作区</h1>
          <p>为 pi-orb 选择专用文件夹，即可开始桌面对话。</p>
          <button id="choose-workspace" type="button">选择文件夹</button>
        </div>
        <p id="transcript-empty" class="history-empty" hidden>告诉我你想在桌面上完成什么。</p>
      </div>
      <div id="question" hidden>
        <div class="question-card">
          <header class="question-heading">
            <div class="question-heading-text">
              <p id="question-eyebrow" hidden></p>
              <h2 id="question-title"></h2>
            </div>
            <button id="question-cancel" type="button"></button>
          </header>
          <p id="question-detail" hidden></p>
          <div id="question-options"></div>
          <textarea id="question-custom" rows="1" hidden></textarea>
          <p id="question-error" role="status" hidden></p>
          <footer class="question-footer">
            <div id="question-pager" class="question-pager" hidden>
              <button id="question-prev" type="button"></button>
              <span id="question-progress"></span>
              <button id="question-next-nav" type="button"></button>
            </div>
            <div class="question-actions">
              <button id="question-skip" type="button"></button>
              <button id="question-continue" type="button"></button>
            </div>
          </footer>
        </div>
      </div>
      <div id="history-list" role="listbox" hidden></div>
      <section id="preview-sheet" class="orb-sheet" hidden aria-label="预览截图">
        <header><strong>预览截图</strong><button id="preview-close" type="button" aria-label="关闭预览">×</button></header>
        <p id="preview-target"></p><img id="preview-image" alt="截图预览"><p id="preview-meta"></p>
        <footer><button id="preview-send" type="button">发送</button><button id="preview-save" type="button">保存副本</button><button id="preview-discard" type="button">丢弃</button></footer>
      </section>
      <section id="model-sheet" class="orb-sheet" hidden aria-label="选择模型">
        <header><strong>模型</strong><button id="model-close" type="button" aria-label="关闭模型选择">×</button></header>
        <div id="model-list" role="listbox"></div>
      </section>
      <section id="shortcut-sheet" class="orb-sheet" hidden aria-label="唤醒快捷键">
        <header><strong>唤醒快捷键</strong><button id="shortcut-close" type="button" aria-label="关闭快捷键设置">×</button></header>
        <form id="shortcut-form">
          <label for="shortcut-input">快捷键</label>
          <input id="shortcut-input" type="text" autocomplete="off" spellcheck="false" maxlength="60">
          <footer><button type="submit">保存</button></footer>
        </form>
      </section>
      <p id="status" role="status"></p>
      <div id="selection-chip" hidden>
        <span id="selection-chip-text"></span>
        <button id="selection-chip-dismiss" type="button"></button>
      </div>
      <form id="composer">
        <label id="input-label"></label>
        <div id="prompt" class="prompt-empty" role="textbox" aria-multiline="true" aria-labelledby="input-label" contenteditable="true"></div>
      </form>
    </section>
    <button id="ball" type="button">
      <img id="ball-gif" src="deepseek-avatar-square.gif" alt="" draggable="false" data-mode="still">
    </button>
    <button id="dock-tab" type="button" hidden aria-hidden="true"></button>
    <button id="stop" type="button" hidden></button>
    <script type="module" src="floating.js"></script>
  </body>
</html>
