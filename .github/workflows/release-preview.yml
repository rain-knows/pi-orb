# Reference workflow shape: deepseek-harness-orb@72f1d738458a223696685a909e806b683eff5885.
# Build the final installer once, then verify its actual unpacked contents, Pi loader and launch.
name: Preview release (Windows x64)
on:
  workflow_dispatch:
    inputs:
      confirm_unsigned:
        description: 'Type "unsigned" to confirm an unsigned preview release'
        required: true
        default: ''
  push:
    tags: ['v*']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require unsigned confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.confirm_unsigned != 'unsigned'
        run: |
          throw 'Confirm unsigned before publishing this preview'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build and verify final installer
        id: package
        run: npm run verify:package
      - name: Keep this run's reports
        if: always() && steps.package.outputs.reports != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-verification
          path: ${{ steps.package.outputs.reports }}
          if-no-files-found: warn
      - name: Collect verified release assets
        shell: pwsh
        run: |
          $reportDir = '${{ steps.package.outputs.reports }}'
          $stage = Get-Content "$reportDir/stage-result.json" -Raw | ConvertFrom-Json
          if (-not $stage.passed) { throw 'Final package verification failed' }
          $installer = $stage.installer.path
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLower() -ne $stage.installer.sha256) { throw 'Installer changed after verification' }
          New-Item -ItemType Directory -Force dist-evidence | Out-Null
          Copy-Item -LiteralPath $installer -Destination dist-evidence/
          Copy-Item "$reportDir/*.json" dist-evidence/
          "$($stage.installer.sha256)  $(Split-Path $installer -Leaf)" | Out-File -Encoding ascii dist-evidence/SHA256SUMS.txt
          @"
          pi-orb $($stage.version) — Windows x64 preview (unsigned)

          This is an unsigned prerelease. Requirements, installation and access rules:
          https://github.com/${{ github.repository }}/blob/${{ github.sha }}/README.md

          Verified scope and limitations for this release commit:
          https://github.com/${{ github.repository }}/blob/${{ github.sha }}/doc/support-matrix.md

          Attached reports describe this final installer build: contents, dependency licenses,
          credentials, real Pi plugin loading and packaged application launch. Clean-machine
          installation and SmartScreen experience remain subject to the support matrix.
          "@ | Out-File -Encoding utf8 dist-evidence/release-notes.md
      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$version" }
          if ($tag -ne "v$version") { throw 'Release tag must match the built manifest' }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists" }
          gh release create $tag --title "pi-orb $version — Windows x64 preview (unsigned)" --notes-file dist-evidence/release-notes.md --prerelease --target '${{ github.sha }}' dist-evidence/*
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
