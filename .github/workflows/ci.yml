# Reference workflow shape: deepseek-harness-orb@72f1d738458a223696685a909e806b683eff5885.
# Pi uses one Windows job; no enterprise runner fallback or monorepo fan-out.
name: CI
on:
  pull_request:
    paths:
      - 'src/**'
      - 'pi-package/**'
      - 'tests/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package*.json'
      - '*.config.*'
      - 'tsconfig.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pi-package/**'
      - 'tests/**'
      - 'scripts/**'
      - 'resources/**'
      - 'package*.json'
      - '*.config.*'
      - 'tsconfig.json'
      - '.github/workflows/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
